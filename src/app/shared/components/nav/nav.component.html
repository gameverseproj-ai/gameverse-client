<nav class="nav">
  <a class="nav__brand" routerLink="/home">GameVerse</a>

  <button class="nav__toggle" (click)="toggleMenu()" aria-label="Toggle menu">
    &#9776;
  </button>

  <ul class="nav__links" [class.nav__links--open]="menuOpen()">
    @for (link of links(); track link.path) {
      <li>
        <a [routerLink]="link.path" routerLinkActive="nav__link--active">
          {{ link.label }}
        </a>
      </li>
    }
  </ul>
</nav>
