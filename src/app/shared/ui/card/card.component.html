<article class="card">
  @if (imageUrl()) {
    <img class="card__image" [src]="imageUrl()" [alt]="title()" loading="lazy" />
  }
  <div class="card__body">
    <h3 class="card__title">{{ title() }}</h3>
    @if (subtitle()) {
      <span class="card__subtitle">{{ subtitle() }}</span>
    }
    <ng-content />
  </div>
</article>
