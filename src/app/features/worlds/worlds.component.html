<section class="worlds">
  <header class="worlds__header">
    <h1>{{ 'Worlds' | t }}</h1>
  </header>

  @if (worldFacade.loading()) {
    <p class="worlds__loading">{{ 'Loading worlds...' | t }}</p>
  }

  @if (worldFacade.error(); as err) {
    <p class="worlds__error">{{ (err) | t }}</p>
  }

  <div class="worlds__grid">
    @for (world of worldFacade.worlds(); track world.id) {
      <app-world-card [world]="world" />
    } @empty {
      @if (!worldFacade.loading()) {
        <p class="worlds__empty">{{ 'No worlds found.' | t }}</p>
      }
    }
  </div>
</section>
