<div class="stats">
  <div class="stats__item">
    <span class="stats__value">{{ highScore() }}</span>
    <span class="stats__label">High Score</span>
  </div>
  <div class="stats__item">
    <span class="stats__value">{{ gamesPlayed() }}</span>
    <span class="stats__label">Games Played</span>
  </div>
  <div class="stats__item">
    <span class="stats__value">{{ totalScore() }}</span>
    <span class="stats__label">Total Score</span>
  </div>
</div>
