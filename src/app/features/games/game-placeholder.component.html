<div class="placeholder">
  <div class="placeholder__card" [style.--accent]="meta().color">
    <span class="placeholder__icon">{{ meta().icon }}</span>
    <h1 class="placeholder__title">{{ meta().label }}</h1>
    <p class="placeholder__status">Coming Soon</p>
    <p class="placeholder__desc">
      This game is under construction. Check back soon for the full experience.
    </p>
    <a routerLink="/world" class="btn btn--primary">Return to World</a>
  </div>
</div>
