<section class="games">
  <header class="games__header">
    <h1>{{ 'Games' | t }}</h1>
    <input
      class="games__search"
      type="search"
      [attr.placeholder]="'Search games...' | t"
      [value]="filter()"
      (input)="filter.set($any($event.target).value)"
      [attr.aria-label]="'Search games' | t"
    />
  </header>

  @if (gameFacade.loading()) {
    <p class="games__loading">{{ 'Loading games...' | t }}</p>
  } @else {
    <app-game-list [games]="gameFacade.games()" [filter]="filter()" />
  }
</section>
